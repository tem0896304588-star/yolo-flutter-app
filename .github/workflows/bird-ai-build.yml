
name: Bird AI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'example/**'
      - '.github/workflows/bird-ai-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Bird AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Check project files
        run: |
          echo "Checking project structure..."
          echo "Repository root:"
          ls -la
          echo "Example directory:"
          ls -la example
          echo "Flutter project files:"
          find example -maxdepth 4 -type f \( -name "pubspec.yaml" -o -name "gradlew" -o -name "camera_inference_screen.dart" \) -print
          test -f example/pubspec.yaml

      - name: Set Gradle wrapper
        working-directory: example
        run: |
          sed -i 's/gradle-8\.14\.0-all\.zip/gradle-8.14.3-all.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Build release APK
        working-directory: example
        run: flutter build apk --release

      - name: Upload Bird AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Bird-AI-APK
          path: example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
