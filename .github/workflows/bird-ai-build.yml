name: Bird AI - Build APK

on:
workflow_dispatch:
push:
branches:
- main
paths:
- 'example/'
- 'android/'
- '.github/workflows/bird-ai-build.yml'

permissions:
contents: read

concurrency:
group: bird-ai-apk-${{ github.ref }}
cancel-in-progress: true

jobs:
build:
name: Build Bird AI APK
runs-on: ubuntu-latest
timeout-minutes: 45

steps:  
  - name: Checkout repository  
    uses: actions/checkout@v4  

  - name: Copy Gradle Wrapper  
    run: |  
      cp android/gradlew example/android/gradlew  
      mkdir -p example/android/gradle/wrapper  
      cp android/gradle/wrapper/gradle-wrapper.jar example/android/gradle/wrapper/  
      chmod +x example/android/gradlew  

  - name: Set up Java  
    uses: actions/setup-java@v4  
    with:  
      distribution: temurin  
      java-version: '17'  

  - name: Set up Flutter  
    uses: subosito/flutter-action@v2  
    with:  
      channel: stable  
      cache: true  

  - name: Check Flutter  
    run: flutter --version  

  - name: Check project files  
    run: |  
      test -f example/pubspec.yaml  
      test -f example/android/gradlew  
      test -f example/android/gradle/wrapper/gradle-wrapper.jar  
      test -f example/android/gradle/wrapper/gradle-wrapper.properties  

  - name: Install dependencies  
    working-directory: example  
    run: flutter pub get  

  - name: Build release APK  
    working-directory: example  
    run: flutter build apk --release  

  - name: Verify APK  
    run: |  
      test -f example/build/app/outputs/flutter-apk/app-release.apk  
      ls -lh example/build/app/outputs/flutter-apk/app-release.apk  

  - name: Upload Bird AI APK  
    uses: actions/upload-artifact@v4  
    with:  
      name: Bird-AI-APK  
      path: example/build/app/outputs/flutter-apk/app-release.apk  
      if-no-files-found: error  
      retention-days: 7
