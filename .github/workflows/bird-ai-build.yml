
name: Bird AI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'example/**'
      - '.github/workflows/bird-ai-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Bird AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Check project files
        run: |
          echo "Checking project structure..."
          ls -la
          ls -la example
          test -f example/pubspec.yaml
          test -f example/android/gradle/wrapper/gradle-wrapper.properties

      - name: Upgrade Gradle Wrapper
        working-directory: example
        run: |
          sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-9.1.3-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Build release APK
        working-directory: example
        run: flutter build apk --release

      - name: Upload Bird AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Bird-AI-APK
          path: example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
