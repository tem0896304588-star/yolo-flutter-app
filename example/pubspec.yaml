name: ultralytics_yolo_example
description: "Demonstrates how to use the ultralytics_yolo plugin."
publish_to: "none"
version: 0.7.2+27

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  app_links: ^7.0.0
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  image_picker: ^1.2.1
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  # Pinned to ^12.x for compatibility with the current iOS project.
  share_plus: ^12.0.0
  flutter_blue_plus: 2.3.15
  ultralytics_yolo:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    
